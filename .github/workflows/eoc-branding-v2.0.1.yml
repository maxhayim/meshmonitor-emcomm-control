name: Publish EmComm Control v2.0.1

on:
  push:
    branches: [main]
    paths:
      - '.eoc-v201-trigger'

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update branding, EOC positioning, and version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path('mm_emcomm_control.py')
          s = script.read_text()
          s = s.replace('#   emoji: 📡', '#   emoji: 🚨', 1)
          s = s.replace('__version__ = "2.0.0"', '__version__ = "2.0.1"', 1)
          needle = '- LIVE mode: real-world operator-entered check-ins, SITREPs, and message logging.\n'
          repl = needle + '- Suitable for emergency operations center (EOC) workflows at city/municipal, county/regional, and state levels.\n'
          if needle in s and 'Suitable for emergency operations center (EOC)' not in s:
              s = s.replace(needle, repl, 1)
          script.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('# 📡 EmComm Control', '# 🚨 EmComm Control', 1)
          old = 'Emergency communications control Script for [**MeshMonitor**](https://github.com/Yeraze/MeshMonitor), supporting both **real-world operations** and **simulated exercises** over [**Meshtastic**](https://meshtastic.org/), [**MeshCore**](https://meshcore.co.uk/), or any other mesh network MeshMonitor supports.'
          new = 'Emergency communications control script for [**MeshMonitor**](https://github.com/Yeraze/MeshMonitor), supporting both **real-world operations** and **simulated exercises** over [**Meshtastic**](https://meshtastic.org/), [**MeshCore**](https://meshcore.co.uk/), or any other mesh network MeshMonitor supports. EmComm Control can support emergency operations center (EOC) workflows for cities and municipalities, counties and regions, and state-level operations.'
          r = r.replace(old, new, 1)
          bullet = '- Operate over Meshtastic, MeshCore, or other networks supported by MeshMonitor\n'
          if bullet in r and 'Support EOC workflows at city/municipal' not in r:
              r = r.replace(bullet, bullet + '- Support EOC workflows at city/municipal, county/regional, and state levels\n', 1)
          marker = '\n---\n\n## Operating modes\n'
          eoc = '''\n---\n\n## Emergency Operations Center (EOC) use\n\nEmComm Control can be deployed as a MeshMonitor communications-control layer in an **Emergency Operations Center (EOC)** or supporting communications room. It is suitable for:\n\n- **City / municipal EOCs** — local incident coordination, field-team check-ins, SITREPs, and message logging\n- **County / regional EOCs** — coordination across municipalities, shelters, facilities, field teams, and regional communications resources\n- **State EOCs** — statewide communications coordination, regional status collection, and operator-entered message tracking\n\nThe same installation can remain in **EXERCISE** mode for drills and SET activities, then be deliberately switched locally to **LIVE** mode for a real activation. EmComm Control is a communications-support and logging tool; it does not replace an agency's incident-management system, dispatch system, records policy, or approved emergency communications plan.\n\n---\n\n## Operating modes\n'''
          if marker in r and '## Emergency Operations Center (EOC) use' not in r:
              r = r.replace(marker, eoc, 1)
          r = r.replace('- **v2.0.0** — renamed to EmComm Control; adds dual LIVE / EXERCISE operation and the new `mm_emcomm_control.py` runtime', '- **v2.0.0** — renamed to EmComm Control; adds dual LIVE / EXERCISE operation and the new `mm_emcomm_control.py` runtime\n- **v2.0.1** — changes the MeshMonitor icon to 🚨 and documents city, county/regional, and state EOC deployments', 1)
          readme.write_text(r)

          docs = Path('docs/index.js')
          d = docs.read_text()
          d = d.replace('<h1>📡 EmComm Control</h1>', '<h1>🚨 EmComm Control</h1>', 1)
          d = d.replace('Emergency communications control for MeshMonitor with deliberately separated LIVE and EXERCISE modes over Meshtastic, MeshCore, or any other mesh network MeshMonitor supports.', 'Emergency communications control for MeshMonitor with deliberately separated LIVE and EXERCISE modes over Meshtastic and MeshCore, suitable for city, county/regional, and state Emergency Operations Center (EOC) workflows.', 1)
          install_marker = '  const modes = el("div", { class: "grid" });\n'
          eoc_card = '''  wrap.appendChild(el("section", { class: "card", html: `\n    <h2>Emergency Operations Center (EOC) use</h2>\n    <p>EmComm Control can support communications-control and logging workflows in government EOCs and supporting communications rooms.</p>\n    <ul>\n      <li><strong>City / municipal EOCs</strong> — local field teams, facilities, SITREPs and message logging</li>\n      <li><strong>County / regional EOCs</strong> — cross-jurisdiction coordination, shelters and regional resources</li>\n      <li><strong>State EOCs</strong> — statewide communications coordination and regional status collection</li>\n    </ul>\n    <p class="muted">It complements, rather than replaces, an agency's incident-management, dispatch, records, and approved emergency communications systems.</p>\n  ` }));\n\n'''
          if install_marker in d and 'Emergency Operations Center (EOC) use' not in d:
              d = d.replace(install_marker, eoc_card + install_marker, 1)
          docs.write_text(d)

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          if '## [2.0.1]' not in c:
              insert = '''## [2.0.1] - 2026-09-09\n\n### Changed\n- Changed the MeshMonitor script-picker emoji from 📡 to 🚨.\n- Added explicit deployment guidance for city/municipal, county/regional, and state Emergency Operations Centers (EOCs).\n- Expanded GitHub Pages and README positioning for government EOC communications-support workflows.\n\n'''
              idx = c.find('## [2.0.0]')
              c = c[:idx] + insert + c[idx:] if idx != -1 else insert + c
          changelog.write_text(c)
          PY

      - name: Commit v2.0.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mm_emcomm_control.py README.md docs/index.js CHANGELOG.md
          git commit -m "v2.0.1 — EOC deployment guidance and alert icon"
          git push

      - name: Publish v2.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.1 --target main --title "v2.0.1 — EOC Deployment Guidance & Alert Icon" --notes $'## EmComm Control v2.0.1 — EOC Deployment Guidance & Alert Icon\n\n### Changed\n- Changed the MeshMonitor script-picker emoji from 📡 to 🚨.\n- Added explicit support documentation for **city / municipal EOCs**, **county / regional EOCs**, and **state EOCs**.\n- Expanded README and GitHub Pages guidance for EOC communications-control and logging workflows.\n\n### Operational scope\nEmComm Control can support operator-entered check-ins, SITREPs, traffic logging, status, and announcements in EOC environments over Meshtastic and MeshCore while retaining the deliberate LIVE / EXERCISE separation introduced in v2.0.0.\n\nEmComm Control complements an agency’s existing incident-management, dispatch, records, and emergency communications systems; it does not replace them.'
