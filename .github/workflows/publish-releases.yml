name: Publish versioned releases

on:
  push:
    branches:
      - main
    paths:
      - '.release-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish v1.0.0 if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
          else
            gh release create v1.0.0 \
              --target 1f394245e365028513bdebecb07c24a9986c268d \
              --title "v1.0.0 — Initial SET Exercise Control" \
              --notes-file RELEASE_NOTES/v1.0.0.md
          fi

      - name: Publish v2.0.0 if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "v2.0.0 already exists"
          else
            gh release create v2.0.0 \
              --target "$GITHUB_SHA" \
              --title "v2.0.0 — EmComm Control: LIVE + EXERCISE" \
              --notes-file RELEASE_NOTES/v2.0.0.md
          fi
