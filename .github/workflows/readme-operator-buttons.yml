name: Add operator button legend to README

on:
  push:
    branches: [main]
    paths:
      - '.readme-buttons-trigger'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add operator control legend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          needle = "The panel provides:\n\n"
          block = """The panel provides:\n\n### Operator view at a glance\n\n**🟡 EXERCISE**\n\n`[ 🟢 ACTIVATE LIVE ]` `[ 🟡 EXERCISE MODE ]` `[ 🔵 STATUS ]`\n\nThe mode indicator makes it immediately clear whether the system is in **EXERCISE** or **LIVE** operation, while the three primary controls give operators one-click access to mode switching and current status.\n\n"""
          if '### Operator view at a glance' not in s:
              if needle not in s:
                  raise SystemExit('README insertion point not found')
              s = s.replace(needle, block, 1)
              p.write_text(s)
          PY
      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Document operator mode buttons in README"
          git push
